spring.application.name=heritage-ai-backend

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Database Configuration (PostgreSQL with H2 fallback capability)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/heritageai_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:heritage_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:heritage_secure_pass_123!}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Security & JWT Configuration
heritage.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
heritage.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Python AI Service Integration
heritage.ai-service.url=${AI_SERVICE_URL:http://localhost:8000}
heritage.ai-service.connect-timeout-ms=5000
heritage.ai-service.read-timeout-ms=30000

# File Storage Configuration
heritage.storage.upload-dir=${FILE_UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
