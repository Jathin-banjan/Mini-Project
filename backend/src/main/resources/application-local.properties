spring.application.name=heritage-ai-backend-local

# Server Configuration
server.port=8080
server.servlet.context-path=/

# H2 in PostgreSQL compatibility mode for instant zero-dependency local execution
spring.datasource.url=jdbc:h2:file:./data/heritageai_local_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Security & JWT Configuration
heritage.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
heritage.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Python AI Service Integration
heritage.ai-service.url=${AI_SERVICE_URL:http://localhost:8000}
heritage.ai-service.connect-timeout-ms=5000
heritage.ai-service.read-timeout-ms=30000

# File Storage Configuration
heritage.storage.upload-dir=${FILE_UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
